nombre: vuelos
zona: silver
descripcion: "Vuelos VRA tipados, en UTC, deduplicados; todas las empresas (es_latam marca el grupo LATAM)"
particiones: [year, month]
clave_natural: [empresa_icao, numero_voo, origen_icao, partida_prevista_local]
columnas:
  - {nombre: id_vuelo, tipo: string, nulo: false}
  - {nombre: empresa_icao, tipo: string, nulo: false}
  - {nombre: es_latam, tipo: boolean, nulo: false}
  - {nombre: numero_voo, tipo: string, nulo: false}
  - {nombre: tipo_linha, tipo: string}
  - {nombre: origen_icao, tipo: string, nulo: false}
  - {nombre: destino_icao, tipo: string, nulo: false}
  - {nombre: partida_prevista_local, tipo: timestamp, nulo: false}
  - {nombre: partida_prevista_utc, tipo: timestamp, nulo: false}
  - {nombre: partida_real_utc, tipo: timestamp}
  - {nombre: chegada_prevista_utc, tipo: timestamp}
  - {nombre: chegada_real_utc, tipo: timestamp}
  - {nombre: situacao_voo, tipo: string}
  - {nombre: cancelado, tipo: boolean, nulo: false}
  - {nombre: demora_salida_min, tipo: double}
  - {nombre: demora_llegada_min, tipo: double}
  - {nombre: es_atipico, tipo: boolean, nulo: false}
  - {nombre: y_demora15, tipo: integer}
  - {nombre: y_demora60, tipo: integer}
  - {nombre: y_clase, tipo: integer}
  - {nombre: archivo_origen, tipo: string}
  - {nombre: run_id, tipo: string}
  - {nombre: year, tipo: integer, nulo: false}
  - {nombre: month, tipo: integer, nulo: false}
