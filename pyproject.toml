[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latam-ops"
version = "1.0.0"
description = "Alerta temprana T-2 h de demoras de salida de LATAM Airlines (ANAC VRA + METAR) con Spark en AWS"
authors = [{ name = "Carlos Díaz Uceda" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pyspark>=3.5.3,<3.6", "pyyaml>=6.0", "boto3>=1.34", "requests>=2.31", "pandas>=2.1,<3", "pyarrow>=14", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latam_ops = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["spark: requiere SparkSession local"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
